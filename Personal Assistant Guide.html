  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

3, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"370e96b6-7da0-4f1a-b518-9485503e8cb6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e8be8fef-dfd4-4141-b032-80e8119785fb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* successwealthwithme — Color tokens\n * Canonical brand palette from the official rebrand brand kit,\n * plus the applied/extended palette used on live product surfaces (sales page).\n */\n:root {\n  /* --- Brand kit canonical (official rebrand) --- */\n  --swm-burgundy: #8b0743;   /* primary — deep magenta/burgundy */\n  --swm-nude:     #ebdbd0;   /* secondary — warm nude/beige */\n  --swm-gold:     #febf00;   /* accent — golden yellow */\n\n  /* --- Burgundy scale (applied surfaces) --- */\n  --burgundy:      #7B1F4B;\n  --burgundy-dark: #5A1536;\n  --burgundy-mid:  #9E3060;\n  --burgundy-soft: #F2E0EB;\n\n  /* --- Cream / nude scale --- */\n  --cream:  #F5EDE4;\n  --cream2: #EEE2D5;\n  --cream3: #E4D3C2;\n\n  /* --- Gold scale (applied) --- */\n  --gold:      #C49A3C;\n  --gold-dark: #A37E26;\n  --gold-soft: #FAF0DC;\n\n  /* --- Ink / neutral text --- */\n  --ink:   #2C2C2C;\n  --ink2:  #4A4A4A;\n  --ink3:  #888080;\n  --white: #FFFFFF;\n\n  /* --- Semantic aliases --- */\n  --color-primary:        var(--swm-burgundy);\n  --color-primary-strong: var(--burgundy-dark);\n  --color-accent:         var(--swm-gold);\n  --surface-page:         var(--cream);\n  --surface-card:         var(--white);\n  --surface-card-alt:     var(--cream2);\n  --surface-invert:       var(--burgundy-dark);\n  --border-subtle:        var(--cream3);\n  --text-heading:         var(--ink);\n  --text-body:            var(--ink2);\n  --text-muted:           var(--ink3);\n  --text-on-invert:       var(--white);\n  --text-eyebrow:         var(--burgundy);\n}\n<\u002Fstyle>\n<style>/* successwealthwithme — Typography tokens\n * Display: Playfair Display (serif). Body/UI: IBM Plex Sans. Mono/labels: IBM Plex Mono.\n * The brand-kit script wordmark (\"SWM\") is a logo asset, not a webfont.\n */\n:root {\n  --font-display: \"Playfair Display\", Georgia, serif;\n  --font-body:    \"IBM Plex Sans\", system-ui, sans-serif;\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, monospace;\n\n  /* Weights */\n  --fw-light:    300; /* @kind other */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n\n  /* Type scale (px) */\n  --fs-display:  54px;   /* hero H1 */\n  --fs-h1:       42px;\n  --fs-h2:       36px;   /* section title */\n  --fs-h3:       24px;\n  --fs-title:    16px;\n  --fs-body:     16px;\n  --fs-small:    14px;\n  --fs-caption:  13px;\n  --fs-micro:    11px;   /* eyebrows / labels */\n\n  /* Line heights */\n  --lh-tight:   1.1;  /* @kind other */\n  --lh-snug:    1.15; /* @kind other */\n  --lh-body:    1.6;  /* @kind other */\n  --lh-relaxed: 1.7;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-display: -0.02em;\n  --ls-eyebrow:  0.16em;  /* uppercase micro-labels */\n  --ls-label:    0.08em;\n\n  /* Semantic */\n  --text-display-family: var(--font-display);\n  --text-body-family:    var(--font-body);\n  --text-label-family:   var(--font-mono);\n}\n<\u002Fstyle>\n<style>/* successwealthwithme — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale */\n  --spa  kit canonical (official rebrand) --- */\n  --swm-burgundy: #8b0743;   /* primary — deep magenta/burgundy */\n  --swm-nude:     #ebdbd0;   /* secondary — warm nude/beige */\n  --swm-gold:     #febf00;   /* accent — golden yellow */\n\n  /* --- Burgundy scale (applied surfaces) --- */\n  --burgundy:      #7B1F4B;\n  --burgundy-dark: #5A1536;\n  --burgundy-mid:  #9E3060;\n  --burgundy-soft: #F2E0EB;\n\n  /* --- Cream / nude scale --- */\n  --cream:  #F5EDE4;\n  --cream2: #EEE2D5;\n  --cream3: #E4D3C2;\n\n  /* --- Gold scale (applied) --- */\n  --gold:      #C49A3C;\n  --gold-dark: #A37E26;\n  --gold-soft: #FAF0DC;\n\n  /* --- Ink / neutral text --- */\n  --ink:   #2C2C2C;\n  --ink2:  #4A4A4A;\n  --ink3:  #888080;\n  --white: #FFFFFF;\n\n  /* --- Semantic aliases --- */\n  --color-primary:        var(--swm-burgundy);\n  --color-primary-strong: var(--burgundy-dark);\n  --color-accent:         var(--swm-gold);\n  --surface-page:         var(--cream);\n  --surface-card:         var(--white);\n  --surface-card-alt:     var(--cream2);\n  --surface-invert:       var(--burgundy-dark);\n  --border-subtle:        var(--cream3);\n  --text-heading:         var(--ink);\n  --text-body:            var(--ink2);\n  --text-muted:           var(--ink3);\n  --text-on-invert:       var(--white);\n  --text-eyebrow:         var(--burgundy);\n}\n\n/* successwealthwithme — Typography tokens\n * Display: Playfair Display (serif). Body/UI: IBM Plex Sans. Mono/labels: IBM Plex Mono.\n * The brand-kit script wordmark (\"SWM\") is a logo asset, not a webfont.\n */\n:root {\n  --font-display: \"Playfair Display\", Georgia, serif;\n  --font-body:    \"IBM Plex Sans\", system-ui, sans-serif;\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, monospace;\n\n  /* Weights */\n  --fw-light:    300; /* @kind other */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n\n  /* Type scale (px) */\n  --fs-display:  54px;   /* hero H1 */\n  --fs-h1:       42px;\n  --fs-h2:       36px;   /* section title */\n  --fs-h3:       24px;\n  --fs-title:    16px;\n  --fs-body:     16px;\n  --fs-small:    14px;\n  --fs-caption:  13px;\n  --fs-micro:    11px;   /* eyebrows / labels */\n\n  /* Line heights */\n  --lh-tight:   1.1;  /* @kind other */\n  --lh-snug:    1.15; /* @kind other */\n  --lh-body:    1.6;  /* @kind other */\n  --lh-relaxed: 1.7;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-display: -0.02em;\n  --ls-eyebrow:  0.16em;  /* uppercase micro-labels */\n  --ls-label:    0.08em;\n\n  /* Semantic */\n  --text-display-family: var(--font-display);\n  --text-body-family:    var(--font-body);\n  --text-label-family:   var(--font-mono);\n}\n\n/* successwealthwithme — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-18: 72px;\n\n  /* Radii (observed on product surfaces) */\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  12px;\n  --radius-xl:  14px;\n  --radius-2xl: 16px;\n  --radius-pill: 20px;\n  --radius-full: 50%;\n\n  /* Shadows */\n  --shadow-card:  0 8px 30px rgba(90,21,54,0.18);\n  --shadow-soft:  0 2px 12px rgba(44,44,44,0.06);\n  --shadow-cta:   0 6px 20px rgba(196,154,60,0.35);\n\n  /* Borders */\n  --border-width: 1px; /* @kind other */\n  --border-card: 1px solid var(--border-subtle); /* @kind other */\n\n  /* Layout */\n  --container-narrow: 780px;\n  --container-wide:   880px;\n  --section-pad-y:    72px;\n  --section-pad-x:    32px;\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 0.15s; /* @kind other */\n  --dur-med:  0.3s;  /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"3cb05bc2-d454-4aea-b4ba-ebcedbb97e53\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: var(--cream); color: var(--ink2); font-family: \"IBM Plex Sans\", sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: var(--burgundy); text-decoration: none; }\n  a:hover { color: var(--burgundy-dark); }\n  h1, h2, h3 { font-family: \"Playfair Display\", serif; color: var(--ink); margin: 0; letter-spacing: -0.02em; text-wrap: pretty; }\n  p { margin: 0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background: var(--cream); min-height: 100vh;\">\n\n  <div style=\"position: sticky; top: 0; z-index: 20; background: var(--burgundy-dark); color: var(--cream); display: flex; align-items: center; justify-content: center; gap: 18px; padding: 11px 20px; font-size: 13px; letter-spacing: 0.02em; border-bottom: 1px solid rgba(255,255,255,0.1);\">\n    <span style=\"font-family: 'IBM Plex Mono', monospace; color: var(--swm-gold); letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px;\">Personal Assistant<\u002Fspan>\n    <span style=\"width: 1px; height: 14px; background: rgba(255,255,255,0.18);\"><\u002Fspan>\n    <span style=\"color: rgba(245,237,228,0.75);\">A no-jargon setup guide<\u002Fspan>\n    <a href=\"#build\" style=\"color: var(--swm-gold); font-weight: 600;\">Start building →<\u002Fa>\n  <\u002Fdiv>\n\n  <section style=\"position: relative; overflow: hidden; background: var(--burgundy-dark); padding: 96px 24px 104px;\">\n    <div style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 36px 36px;\"><\u002Fdiv>\n    <div style=\"position: absolute; top: -180px; right: -140px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(196,154,60,0.28), transparent 68%);\"><\u002Fdiv>\n    <div style=\"position: absolute; bottom: -220px; left: -160px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(158,48,96,0.45), transparent 70%);\"><\u002Fdiv>\n\n    <div style=\"position: relative; max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(320px, 1.05fr) minmax(300px, 0.95fr); gap: 64px; align-items: center;\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--swm-gold); margin-bottom: 24px;\">\n          <span style=\"width: 32px; height: 1.5px; background: var(--swm-gold);\"><\u002Fspan>\n          A no-jargon setup guide\n        <\u002Fdiv>\n        <h1 style=\"font-size: 54px; line-height: 1.1; color: var(--white); margin-bottom: 24px;\">Your inbox and calendar, run by an <em style=\"color: var(--swm-gold);\">assistant<\u002Fem>.<\u002Fh1>\n        <p style=\"font-size: 17px; font-weight: 300; line-height: 1.75; color: rgba(245,237,228,0.82); max-width: 500px; margin-bottom: 34px;\">One Claude Project that triages Gmail, preps your calendar, and hands you a morning briefing. Copy, paste, run. No code.<\u002Fp>\n        <x-import component-from-global-scope=\"SuccesswealthwithmeDesignSystem_26e51d.Button\" href=\"#build\" size=\"lg\" hint-size=\"240px,58px\">Build it in 7 steps ↓<\u002Fx-import>\n        <p style=\"margin-top: 34px; font-size: 14px; font-weight: 300; color: rgba(245,237,228,0.6);\">A setup guide by <strong style=\"color: var(--cream); font-weight: 600;\">Marilyn Foong<\u002Fstrong> · Founder of <strong style=\"color: var(--cream); font-weight: 600;\">Success Wealth With Me<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 16px; box-shadow: 0 18px 50px rgba(90,21,54,0.4); overflow: hidden;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--cream2); background: var(--cream);\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--burgundy);\">Morning Briefing<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink3);\">Today<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 22px 26px; display: flex; flex-direction: column; gap: 20px;\">\n          <div>\n            <h3 style=\"font-size: 24px; margin-bottom: 6px;\">Here's your day.<\u002Fh3>\n            <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink3);\">12 unread · 3 must-reply<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px;\">Top 3 must-reply<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">1<\u002Fspan>\n                <p style=\"font-size: 14px; font-weight: 300; line-height: 1.5; color: var(--ink2);\">Finance — July invoice, needs your OK by Fri<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">2<\u002Fspan>\n                <p style=\"font-size: 14px; font-weight: 300; line-height: 1.5; color: var(--ink2);\">Client — wants the headline changed before launch<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">3<\u002Fspan>\n                <p style=\"font-size: 14px; font-weight: 300; line-height: 1.5; color: var(--ink2);\">Booking — new call request, Thursday 3pm<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid var(--cream2); padding-top: 18px;\">\n            <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 10px;\">Today's calendar<\u002Fp>\n            <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: var(--ink2);\"><strong style=\"color: var(--ink); font-weight: 600;\">10:00<\u002Fstrong> Client call · <strong style=\"color: var(--ink); font-weight: 600;\">14:00<\u002Fstrong> Deep Work · <strong style=\"color: var(--ink); font-weight: 600;\">16:30<\u002Fstrong> Team sync<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: var(--burgundy-soft); border-left: 2px solid var(--gold); border-radius: 8px; padding: 12px 14px;\">\n            <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 6px;\">Flags<\u002Fp>\n            <p style=\"font-size: 14px; font-weight: 300; color: var(--ink2);\">Invoice due Friday · double-booked at 3pm<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 80px 24px; max-width: 1060px; margin: 0 auto;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n      <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n      01 / What it does\n    <\u002Fdiv>\n    <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">Three jobs, zero fluff.<\u002Fh2>\n    <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; color: var(--ink2); max-width: 620px; margin-bottom: 44px;\">It's not a chatbot you talk to for fun. It's an assistant with one purpose: keep your day tight.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px;\">\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-top: 3px solid var(--burgundy); border-radius: 14px; padding: 28px 26px;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px;\">Inbox triage<\u002Fp>\n        <h3 style=\"font-size: 23px; margin-bottom: 12px;\">Cleans the noise<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Reads your unread, surfaces the 3 that actually need you, and drafts replies in your voice. It never sends. You approve every one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-top: 3px solid var(--burgundy); border-radius: 14px; padding: 28px 26px;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px;\">Calendar prep<\u002Fp>\n        <h3 style=\"font-size: 23px; margin-bottom: 12px;\">Guards your time<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Lays out your day, spots conflicts, blocks deep work, and only books an event after you say yes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-top: 3px solid var(--burgundy); border-radius: 14px; padding: 28px 26px;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 12px;\">Morning briefing<\u002Fp>\n        <h3 style=\"font-size: 23px; margin-bottom: 12px;\">One prompt, whole day<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Unread count, top 3 must-reply, today's schedule, and every flag waiting on you. In one line, every morning.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: var(--cream2); border-top: 1px solid var(--cream3); border-bottom: 1px solid var(--cream3); padding: 80px 24px;\">\n    <div style=\"max-width: 1060px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n        <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n        02 / Before you build\n      <\u002Fdiv>\n      <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">Plug it into your Google.<\u002Fh2>\n      <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; max-width: 620px; margin-bottom: 44px;\">Instructions alone give it nothing to read. Connect two apps first.<\u002Fp>\n\n      <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px;\">\n        <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 14px; padding: 24px 26px; display: grid; grid-template-columns: 42px 1fr; gap: 20px; align-items: start;\">\n          <span style=\"width: 42px; height: 42px; border-radius: 50%; background: var(--burgundy); color: var(--white); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 19px;\">1<\u002Fspan>\n          <div>\n            <h3 style=\"font-size: 21px; margin-bottom: 8px;\">Open Settings, then Connectors<\u002Fh3>\n            <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Connect Google Calendar, then Gmail. Sign in with your Google account and approve the access.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 14px; padding: 24px 26px; display: grid; grid-template-columns: 42px 1fr; gap: 20px; align-items: start;\">\n          <span style=\"width: 42px; height: 42px; border-radius: 50%; background: var(--burgundy); color: var(--white); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 19px;\">2<\u002Fspan>\n          <div>\n            <h3 style=\"font-size: 21px; margin-bottom: 8px;\">On a Team or Enterprise plan?<\u002Fh3>\n            <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Your workspace owner has to switch these connectors on at the org level first. On a personal Pro or Max account, you just authenticate yourself.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 14px; padding: 24px 26px; display: grid; grid-template-columns: 42px 1fr; gap: 20px; align-items: start;\">\n          <span style=\"width: 42px; height: 42px; border-radius: 50%; background: var(--burgundy); color: var(--white); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 19px;\">3<\u002Fspan>\n          <div>\n            <h3 style=\"font-size: 21px; margin-bottom: 8px;\">Turn them on inside the project<\u002Fh3>\n            <p style=\"font-size: 15px; font-weight: 300; line-height: 1.75;\">Once you're in the project chat, click the + in the message box and toggle Gmail and Google Calendar on. This is the step people miss.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;\">\n        <div style=\"background: var(--gold-soft); border: 1px dashed var(--gold); border-radius: 14px; padding: 22px 24px;\">\n          <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 10px;\">Draft only<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">Gmail cannot send.<\u002Fstrong> Claude writes the draft straight into your Gmail. You click send yourself, every time.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: var(--gold-soft); border: 1px dashed var(--gold); border-radius: 14px; padding: 22px 24px;\">\n          <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 10px;\">Full access<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">Calendar is read and write.<\u002Fstrong> It can create events once you approve them, so booking works end to end.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: var(--gold-soft); border: 1px dashed var(--gold); border-radius: 14px; padding: 22px 24px;\">\n          <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 10px;\">In-chat<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">It runs when you run it.<\u002Fstrong> Open the project, fire the prompt. It won't triage in the background while you sleep.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"build\" style=\"padding: 80px 24px; max-width: 1060px; margin: 0 auto; scroll-margin-top: 56px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n      <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n      03 / Build the project\n    <\u002Fdiv>\n    <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">Name it and describe it.<\u002Fh2>\n    <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; max-width: 620px; margin-bottom: 40px;\">Sidebar → Projects → New project. Paste these two in, then open Instructions for the next step.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n      <div style=\"background: var(--gold-soft); border: 1px solid var(--cream3); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(90,21,54,0.12);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--cream3); background: rgba(196,154,60,0.1);\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark);\">Project name<\u002Fspan>\n          <button sc-camel-on-click=\"{{ copyName }}\" style=\"background: var(--white); border: 1px solid var(--cream3); color: var(--burgundy); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 5px 12px; border-radius: 20px; cursor: pointer;\" style-hover=\"border-color: var(--burgundy-mid); color: var(--burgundy-dark);\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre style=\"margin: 0; padding: 20px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap;\">Personal Assistant<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"background: var(--gold-soft); border: 1px solid var(--cream3); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(90,21,54,0.12);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--cream3); background: rgba(196,154,60,0.1);\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark);\">Project description<\u002Fspan>\n          <button sc-camel-on-click=\"{{ copyDesc }}\" style=\"background: var(--white); border: 1px solid var(--cream3); color: var(--burgundy); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 5px 12px; border-radius: 20px; cursor: pointer;\" style-hover=\"border-color: var(--burgundy-mid); color: var(--burgundy-dark);\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre style=\"margin: 0; padding: 20px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap;\">My exec. Handles inbox triage, calendar prep, and morning briefings across Gmail and Google Calendar.<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: var(--burgundy-dark); padding: 84px 24px; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 36px 36px;\"><\u002Fdiv>\n    <div style=\"position: absolute; top: -160px; left: -120px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(196,154,60,0.22), transparent 70%);\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 880px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--swm-gold); margin-bottom: 18px;\">\n        <span style=\"width: 32px; height: 1.5px; background: var(--swm-gold);\"><\u002Fspan>\n        04 / Paste in the brain\n      <\u002Fdiv>\n      <h2 style=\"font-size: 38px; line-height: 1.15; color: var(--white); margin-bottom: 16px;\">The custom instructions.<\u002Fh2>\n      <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; color: rgba(245,237,228,0.8); max-width: 620px; margin-bottom: 36px;\">This is the whole system prompt. Open your project's Custom Instructions and paste the entire block.<\u002Fp>\n\n      <div style=\"background: var(--cream); border: 1px solid var(--cream3); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(20,8,14,0.28);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 20px; border-bottom: 1px solid var(--cream3); background: var(--cream2);\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark);\">Custom Instructions<\u002Fspan>\n          <button sc-camel-on-click=\"{{ copyInstructions }}\" style=\"background: var(--swm-gold); border: none; color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; padding: 7px 16px; border-radius: 20px; cursor: pointer;\" style-hover=\"background: var(--gold-dark);\">Copy all<\u002Fbutton>\n        <\u002Fdiv>\n        <pre style=\"margin: 0; padding: 26px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; overflow-x: auto;\"># Role\nYou are my personal assistant. Your job is to keep my inbox clean, my calendar tight, and my day prepped, with zero fluff.\n\n# What you have access to\n- Gmail (read + draft only, never send)\n- Google Calendar (read + create events on approval)\n\n# Rules\n1. When I ask for a briefing, give me: unread count, top 3 must-reply emails, today's calendar, flags/conflicts.\n2. Never send emails. Only draft. I review every draft.\n3. Match my voice in drafts: direct, short sentences, no corporate filler. If you don't know my voice, ask for 2 sample replies.\n4. Flag anything urgent: deadlines, money, angry customers, decisions waiting on me.\n5. Default calendar events to 30 min. Add a prep note in the description when useful.\n6. For focus blocks, use 2-hour blocks labeled \"Deep Work — [topic].\" Only add to days with fewer than 3 existing meetings.\n7. Always confirm before creating events. Never book without approval unless I say \"book it.\"\n\n# Output format\nFor briefings:\n- Unread count + top 3 must-reply (sender, subject, 1-line summary)\n- Today's calendar (time, who, prep if needed)\n- Flags / conflicts\n\nFor reply drafts:\n- Original email in 1 line\n- The draft\n- Ask: \"Send as-is, edit, or skip?\"<\u002Fpre>\n      <\u002Fdiv>\n      <p style=\"margin-top: 22px; font-size: 15px; font-weight: 300; line-height: 1.75; color: rgba(245,237,228,0.7);\">Tip: if your own writing voice matters to you, have two of your real short replies ready. It'll ask for them on the first run and lock your tone from then on.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 80px 24px; max-width: 1060px; margin: 0 auto;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n      <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n      05 / The rules, in plain language\n    <\u002Fdiv>\n    <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">What each rule actually buys you.<\u002Fh2>\n    <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; max-width: 620px; margin-bottom: 44px;\">Seven lines in the config. Here's what they do once it's live.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">1<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Briefing on demand<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">Ask for a briefing and get unread count, top 3 must-reply, today's calendar, and flags. Same shape every time.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">2<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Draft, never send<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">It only ever drafts. The send button stays yours. Nothing leaves your inbox without you.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">3<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Your voice, not robot voice<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">Drafts read like you. Direct, short, no corporate filler. First run it learns you from 2 sample replies.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">4<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Urgent floats up<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">Deadlines, money, angry customers, decisions parked on you. All pulled to the top so nothing slips.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">5<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Tidy events<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">New events default to 30 minutes, with a prep note dropped in the description when it helps.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">6<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Protected deep work<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">Two-hour Deep Work blocks, only added to days with fewer than 3 meetings. It won't cram a full day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--white); border: 1px solid var(--cream3); border-left: 2px solid var(--gold); border-radius: 12px; padding: 24px 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--burgundy); font-weight: 600;\">7<\u002Fspan>\n        <h3 style=\"font-size: 20px; margin: 8px 0 10px;\">Nothing booked without a yes<\u002Fh3>\n        <p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">It always confirms first. Nothing lands on your calendar unless you say \"book it.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: var(--cream2); border-top: 1px solid var(--cream3); border-bottom: 1px solid var(--cream3); padding: 80px 24px;\">\n    <div style=\"max-width: 1060px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n        <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n        06 / What it hands back\n      <\u002Fdiv>\n      <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">Two clean formats.<\u002Fh2>\n      <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; max-width: 620px; margin-bottom: 44px;\">You always get the same structure, so you can scan it in seconds.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px;\">\n        <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 14px; padding: 28px 26px;\">\n          <h3 style=\"font-size: 24px; margin-bottom: 6px;\">Briefing<\u002Fh3>\n          <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 20px;\">When you ask for your day<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">Unread count<\u002Fstrong> + top 3 must-reply (sender, subject, one line)<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">Today's calendar<\u002Fstrong> (time, who, prep if needed)<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">Flags and conflicts<\u002Fstrong> waiting on you<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--white); border: 1px solid var(--cream3); border-radius: 14px; padding: 28px 26px;\">\n          <h3 style=\"font-size: 24px; margin-bottom: 6px;\">Reply<\u002Fh3>\n          <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 20px;\">When it drafts an email<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">The original email<\u002Fstrong> in one line<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\"><strong style=\"color: var(--ink); font-weight: 600;\">The draft<\u002Fstrong>, written in your voice<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: var(--gold-dark);\">✓<\u002Fspan><p style=\"font-size: 15px; font-weight: 300; line-height: 1.7;\">Then it asks: \"Send as-is, edit, or skip?\"<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 80px 24px; max-width: 880px; margin: 0 auto;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--burgundy); margin-bottom: 18px;\">\n      <span style=\"width: 32px; height: 1.5px; background: var(--gold);\"><\u002Fspan>\n      07 / Run your first briefing\n    <\u002Fdiv>\n    <h2 style=\"font-size: 38px; line-height: 1.15; margin-bottom: 16px;\">One line to start your morning.<\u002Fh2>\n    <p style=\"font-size: 16px; font-weight: 300; line-height: 1.8; margin-bottom: 34px;\">Paste this into your project chat. That's the whole habit.<\u002Fp>\n\n    <div style=\"background: var(--gold-soft); border: 1px solid var(--cream3); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(90,21,54,0.12);\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--cream3); background: rgba(196,154,60,0.1);\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dark);\">Prompt to run<\u002Fspan>\n        <button sc-camel-on-click=\"{{ copyPrompt }}\" style=\"background: var(--white); border: 1px solid var(--cream3); color: var(--burgundy); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 5px 12px; border-radius: 20px; cursor: pointer;\" style-hover=\"border-color: var(--burgundy-mid); color: var(--burgundy-dark);\">Copy<\u002Fbutton>\n      <\u002Fdiv>\n      <pre style=\"margin: 0; padding: 20px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap;\">Give me my morning briefing. Unread count, top 3 must-reply emails with draft replies.<\u002Fpre>\n    <\u002Fdiv>\n    <p style=\"margin-top: 20px; font-size: 15px; font-weight: 300; line-height: 1.75; color: var(--ink2);\">First run it may ask for your 2 sample replies. After that, this one line is your whole morning routine.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"background: var(--burgundy-dark); padding: 88px 24px; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 36px 36px;\"><\u002Fdiv>\n    <div style=\"position: absolute; bottom: -200px; right: -140px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(196,154,60,0.24), transparent 70%);\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 880px; margin: 0 auto; text-align: center;\">\n      <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--swm-gold); margin-bottom: 16px;\">The whole build, in one glance<\u002Fp>\n      <h2 style=\"font-size: 40px; line-height: 1.15; color: var(--white); margin-bottom: 44px;\">Personal Assistant, from zero.<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 0; text-align: left; border-top: 1px solid rgba(255,255,255,0.12);\">\n        <div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 20px; padding: 20px 4px; border-bottom: 1px solid rgba(255,255,255,0.12); align-items: baseline;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--swm-gold);\">Connect<\u002Fspan>\n          <p style=\"font-size: 16px; font-weight: 300; line-height: 1.6; color: rgba(245,237,228,0.85);\"><strong style=\"color: var(--white); font-weight: 600;\">Gmail + Calendar<\u002Fstrong> in Settings, then toggle on inside the project<\u002Fp>\n nt. Your job is to keep my inbox clean, my calendar tight, and my day prepped, with zero fluff.\n\n# What you have access to\n- Gmail (read + draft only, never send)\n- Google Calendar (read + create events on approval)\n\n# Rules\n1. When I ask for a briefing, give me: unread count, top 3 must-reply emails, today's calendar, flags/conflicts.\n2. Never send emails. Only draft. I review every draft.\n3. Match my voice in drafts: direct, short sentences, no corporate filler. If you don't know my voice, ask for 2 sample replies.\n4. Flag anything urgent: deadlines, money, angry customers, decisions waiting on me.\n5. Default calendar events to 30 min. Add a prep note in the description when useful.\n6. For focus blocks, use 2-hour blocks labeled \"Deep Work — [topic].\" Only add to days with fewer than 3 existing meetings.\n7. Always confirm before creating events. Never book without approval unless I say \"book it.\"\n\n# Output format\nFor briefings:\n- Unread count + top 3 must-reply (sender, subject, 1-line summary)\n- Today's calendar (time, who, prep if needed)\n- Flags / conflicts\n\nFor reply drafts:\n- Original email in 1 line\n- The draft\n- Ask: \"Send as-is, edit, or skip?\"`;\n    return {\n      copyName: (e) => this.copy(\"Personal Assistant\", e),\n      copyDesc: (e) => this.copy(\"My exec. Handles inbox triage, calendar prep, and morning briefings across Gmail and Google Calendar.\", e),\n      copyInstructions: (e) => this.copy(instructions, e),\n      copyPrompt: (e) => this.copy(\"Give me my morning briefing. Unread count, top 3 must-reply emails with draft replies.\", e),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
